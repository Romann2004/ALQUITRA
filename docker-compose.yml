version: '3.8'

services:
  postgres-db:
    image: postgres:17
    restart: always
    container_name: postgres-alquiler
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: alquiler_trajes
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_vol:/var/lib/postgresql/data

  mongo-db:
    image: mongo:latest
    container_name: mongo-alquiler
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_vol:/data/db

volumes:
  postgres_data_vol:
  mongo_data_vol:
