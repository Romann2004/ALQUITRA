version: '3.8'

services:
  postgres-db:
    image: postgres:17
    container_name: postgres-alquiler
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: alquiler_trajes
    ports:
      - "5433:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  mongo-db:
    image: mongo:latest
    container_name: mongo-alquiler
    ports:
      - "27017:27017"
    volumes:
      - ./mongo_data:/data/db