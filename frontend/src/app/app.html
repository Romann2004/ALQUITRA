<div *ngIf="mostrarMenu; else vistaPublica" class="wrapper-sistema">
  <mat-sidenav-container class="premium-sidenav-container">
    
    <mat-sidenav mode="side" opened class="sidenav premium-sidenav">
      
      <div class="sidenav-wrapper">
        
        <div class="sidenav-brand">
          <div class="brand-icon">
            <mat-icon>checkroom</mat-icon>
          </div>
          <span class="brand-text">ALQUITRA</span>
        </div>

        <div class="sidenav-menu">
          <mat-nav-list>
            <a mat-list-item routerLink="/dashboard" routerLinkActive="active-menu-item">
              <mat-icon matListItemIcon>dashboard</mat-icon> 
              <span matListItemTitle class="menu-text">Dashboard</span>
            </a>
            <a mat-list-item routerLink="/gestion-clientes" routerLinkActive="active-menu-item">
              <mat-icon matListItemIcon>groups</mat-icon> 
              <span matListItemTitle class="menu-text">Clientes</span>
            </a>
            <a mat-list-item routerLink="/gestion-trajes" routerLinkActive="active-menu-item">
              <mat-icon matListItemIcon>inventory_2</mat-icon> 
              <span matListItemTitle class="menu-text">Trajes</span>
            </a>
            <a mat-list-item routerLink="/reservas" routerLinkActive="active-menu-item">
              <mat-icon matListItemIcon>event_note</mat-icon> 
              <span matListItemTitle class="menu-text">Reservas</span>
            </a>
          </mat-nav-list>
        </div>

        <div class="sidenav-footer">
          <mat-divider></mat-divider>
          <mat-nav-list>
            <a mat-list-item (click)="toggleDarkMode()" class="action-btn mode-btn">
              <mat-icon matListItemIcon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon> 
              <div matListItemTitle class="menu-text" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <span>Modo Oscuro</span>
                <!-- El pointer-events: none evita que el toggle intercepte el clic, dejando que la fila entera sea clickeable -->
                <mat-slide-toggle [checked]="isDarkMode" style="pointer-events: none;"></mat-slide-toggle>
              </div>
            </a>            
            <button mat-list-item (click)="logout()" class="action-btn logout-btn">
              <mat-icon matListItemIcon>logout</mat-icon> 
              <span matListItemTitle class="menu-text">Cerrar Sesión</span>
            </button>
          </mat-nav-list>
        </div>

      </div>
    </mat-sidenav>

    <mat-sidenav-content class="main-content">
      <router-outlet></router-outlet>
    </mat-sidenav-content>

  </mat-sidenav-container>
</div>

<ng-template #vistaPublica>
  <div class="login-wrapper">
    <router-outlet></router-outlet>
  </div>
</ng-template>

<ng-template #logoutDialog>
  <h2 mat-dialog-title>¿Cerrar Sesión?</h2>
  
  <mat-dialog-content>
    <p style="margin: 0; color: #64748b;">¿Estás seguro de que deseas salir del sistema? Deberás ingresar tus credenciales nuevamente para acceder.</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <!-- Si cancela, simplemente cierra el modal -->
    <button mat-button mat-dialog-close>Cancelar</button>
    <!-- Si confirma, ejecuta el cierre definitivo (usamos la clase logout-btn de tu CSS para el detalle rojo) -->
    <button mat-flat-button color="warn" style="border-radius: 8px;" (click)="confirmarLogout()">
      <mat-icon>logout</mat-icon> Salir
    </button>
  </mat-dialog-actions>
</ng-template>
