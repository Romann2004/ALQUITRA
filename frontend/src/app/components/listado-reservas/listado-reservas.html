<div class="container">
  <mat-toolbar color="primary">
    <span>Listado de Reservas</span>
    <span class="example-spacer"></span>
    <button mat-raised-button color="accent">Nueva Reserva</button>
  </mat-toolbar>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> Nro. </th>
      <td mat-cell *matCellDef="let element"> {{element.id}} </td>
    </ng-container>

    <ng-container matColumnDef="cliente">
      <th mat-header-cell *matHeaderCellDef> Cliente </th>
      <td mat-cell *matCellDef="let element">
        {{element.Cliente?.nombre}} 
      </td>
    </ng-container>

    <ng-container matColumnDef="traje">
      <th mat-header-cell *matHeaderCellDef> Traje </th>
      <td mat-cell *matCellDef="let element">
        {{element.Traje?.categoria}} (Talle {{element.Traje?.talle}}) 
      </td>
    </ng-container>

    <ng-container matColumnDef="fechaRetiro">
      <th mat-header-cell *matHeaderCellDef> Fecha Retiro </th>
      <td mat-cell *matCellDef="let element">
        {{element.fechaRetiro | date:'dd/MM/yyyy'}}
      </td>
    </ng-container>

    <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef> Estado </th>
        <td mat-cell *matCellDef="let element"> 
            <span class="badge" [ngClass]="element.estado.toLowerCase()">
              {{element.estado}}
            </span>
        </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef> </th>
      <td mat-cell *matCellDef="let element">
        <mat-icon color="primary" style="cursor: pointer;">edit</mat-icon>
        <mat-icon color="warn" style="cursor: pointer;">delete</mat-icon>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
