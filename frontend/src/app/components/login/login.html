<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Ingreso al Sistema</mat-card-title>
    </mat-card-header>
    
    <form [formGroup]="LoginForm" (ngSubmit)="onLogin()">
      <mat-card-content>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Usuario</mat-label>
          <input matInput formControlName="username" placeholder="Tu username">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput formControlName="password" type="password" placeholder="Tu contraseña">
        </mat-form-field>
      </mat-card-content>

      <mat-card-actions>
        <button mat-raised-button color="primary" class="full-width" type="submit" [disabled]="LoginForm.invalid">
          ENTRAR
        </button>
      </mat-card-actions>
    </form>
  </mat-card>
</div>
