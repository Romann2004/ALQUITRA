<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ALQUITRA</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    /* Estilos del Splash Screen (Solo viven durante la carga inicial) */
    body {
      margin: 0;
      background-color: #f8fafc; /* Color de fondo de la app */
    }
    .splash-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    .splash-logo {
      width: 220px; /* Tamaño del logo */
      height: auto;
      animation: pulse 1.5s infinite ease-in-out;
    }
    
    /* Animación de latido suave para indicar que está cargando */
    @keyframes pulse {
      0% { transform: scale(0.97); opacity: 0.8; }
      50% { transform: scale(1.03); opacity: 1; }
      100% { transform: scale(0.97); opacity: 0.8; }
    }
  </style>
</head>
<body>
  <app-root>
    <!-- Esto es lo que el usuario ve apenas abre la URL -->
    <div class="splash-screen">
      <img src="assets/favicon.png" alt="ALQUITRA Logo" class="splash-logo">
    </div>
  </app-root>
</body>
</html>
